<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            width: 300px;
            font-family: sans-serif;
            padding: 12px;
            background: #111;
            color: #eee;
            margin: 0;
        }

        h3 {
            margin: 0 0 12px;
            font-size: 16px;
            border-bottom: 1px solid #333;
            padding-bottom: 8px;
        }

        #debugBox {
            background: #ffff00;
            color: #000;
            padding: 8px;
            font-size: 11px;
            margin-bottom: 12px;
            border-radius: 4px;
            word-wrap: break-word;
            max-height: 100px;
            overflow-y: auto;
            font-family: monospace;
        }

        label {
            font-size: 12px;
            color: #aaa;
            display: block;
            margin-top: 8px;
            margin-bottom: 4px;
        }

        select, button, input[type=text] {
            width: 100%;
            margin-bottom: 8px;
            padding: 8px;
            background: #222;
            color: #eee;
            border: 1px solid #444;
            border-radius: 4px;
            font-size: 13px;
            box-sizing: border-box;
        }

        button {
            cursor: pointer;
            background: #007bff;
            color: white;
            border: none;
            font-weight: bold;
            margin-top: 12px;
        }

            button:hover {
                background: #0056b3;
            }

        #manualTopicsBox {
            display: none;
        }

        .questionCard {
            background: #1c1c1c;
            border: 1px solid #333;
            border-radius: 6px;
            padding: 8px;
            margin-bottom: 8px;
            font-size: 12px;
        }

            .questionCard .qLabel {
                font-weight: bold;
                color: #fca;
            }

            .questionCard .qTopics {
                color: #9cf;
            }

            .questionCard .qConcepts {
                color: #9f9;
            }

            .questionCard .qDifficulty {
                color: #f96;
                font-weight: bold;
            }

            .questionCard .qReasoning {
                color: #aaa;
                font-style: italic;
            }
    </style>
</head>
<body>
    <h3>⚡ TouchGrass</h3>

    <button id="openPlanner" style="background:#28a745;">📅 Open Study Planner</button>

    <div id="debugBox">Loading...</div>
    <label>Teacher</label>
    <select id="teacherFilter">
        <option value="all">All teachers</option>
    </select>

    <button id="applyFilters">Apply Filter</button>

    <label>Milestone 1 check</label>
    <button id="testAuth">Test Classroom API Auth</button>
    <div id="authResult" style="font-size: 11px; color: #9f9; word-wrap: break-word;"></div>

    <label>Milestone 2 check</label>
    <select id="courseSelect"><option value="">Run auth test first ↑</option></select>
    <button id="syncCourse">Sync Selected Course Data</button>
    <div id="syncResult" style="font-size: 11px; color: #9cf; word-wrap: break-word;"></div>

    <label>Milestone 4 check: Difficulty Estimation</label>
    <select id="assignmentSelect"><option value="">Sync a course first ↑</option></select>
    <button id="estimateBtn">Estimate Difficulty</button>
    <div id="difficultyResult" style="font-size: 12px; color: #fc9; word-wrap: break-word;"></div>

    <label>Milestone 5 check: Topic & Concept Breakdown (per question)</label>
    <button id="analyzeTopicsBtn">Analyze Question-by-Question</button>
    <button id="useManualTopicsBtn" style="background:#555;">Use My Own Topic List Instead</button>
    <div id="manualTopicsBox">
        <label>Enter topics, comma-separated:</label>
        <input type="text" id="manualTopicsInput" placeholder="e.g. Graphs, Trees, Recursion">
        <button id="saveManualTopicsBtn">Save Topics & Retry</button>
    </div>
    <div id="topicStatus" style="font-size: 12px; color: #fca; word-wrap: break-word;"></div>
    <div id="topicResult"></div>

    <script src="popup.js"></script>
</body>
</html>
