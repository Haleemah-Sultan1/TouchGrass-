<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            width: 300px;
            font-family: sans-serif;
            padding: 12px;
            background: #111;
            color: #eee;
            margin: 0;
        }

        h3 {
            margin: 0 0 12px;
            font-size: 16px;
            border-bottom: 1px solid #333;
            padding-bottom: 8px;
        }

        #debugBox {
            background: #ffff00;
            color: #000;
            padding: 8px;
            font-size: 11px;
            margin-bottom: 12px;
            border-radius: 4px;
            word-wrap: break-word;
            max-height: 100px;
            overflow-y: auto;
            font-family: monospace;
        }

        label {
            font-size: 12px;
            color: #aaa;
            display: block;
            margin-top: 8px;
            margin-bottom: 4px;
        }

        select, button {
            width: 100%;
            margin-bottom: 8px;
            padding: 8px;
            background: #222;
            color: #eee;
            border: 1px solid #444;
            border-radius: 4px;
            font-size: 13px;
            box-sizing: border-box;
        }

        button {
            cursor: pointer;
            background: #007bff;
            color: white;
            border: none;
            font-weight: bold;
            margin-top: 12px;
        }

            button:hover {
                background: #0056b3;
            }

        .toggle-wrap {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 12px 0;
        }

        .toggle-label-text {
            font-size: 12px;
            color: #aaa;
            font-weight: 600;
        }

        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 38px;
            height: 20px;
            flex-shrink: 0;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
            position: absolute;
        }

        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #2a2a2a;
            border-radius: 20px;
            transition: 0.2s;
        }

        .toggle-slider::before {
            content: '';
            position: absolute;
            width: 14px;
            height: 14px;
            left: 3px;
            top: 3px;
            background: white;
            border-radius: 50%;
            transition: 0.2s;
        }

        .toggle-switch input:checked + .toggle-slider {
            background: #34A853;
        }

        .toggle-switch input:checked + .toggle-slider::before {
            transform: translateX(18px);
        }

        /* ---- Pinned posts ---- */
        #pinned-section {
            margin-top: 14px;
            border-top: 1px solid #333;
            padding-top: 10px;
        }

        #pinned-header {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: #aaa;
            font-weight: 600;
            margin-bottom: 6px;
        }

        #pinned-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 200px;
            overflow-y: auto;
        }

        .pinned-item {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #1c1c1c;
            border: 1px solid #333;
            border-radius: 6px;
            padding: 8px;
            cursor: pointer;
        }

        .pinned-item:hover {
            background: #262626;
        }

        .pin-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #7F77DD;
            flex-shrink: 0;
        }

        .pin-snippet {
            font-size: 11px;
            color: #ddd;
            line-height: 1.4;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            line-clamp: 2;
           -webkit-box-orient: vertical;
        }

        .pin-time {
            font-size: 10px;
            color: #666;
            margin-top: 2px;
        }

        .unpin-btn {
            background: none;
            border: none;
            color: #777;
            font-size: 12px;
            cursor: pointer;
            padding: 2px 6px;
            width: auto;
            margin: 0;
            flex-shrink: 0;
        }

        .unpin-btn:hover {
            color: #f87171;
            background: rgba(248, 113, 113, 0.15);
            border-radius: 4px;
        }

        .empty-state {
            font-size: 11px;
            color: #666;
            text-align: center;
            padding: 14px 0;
            line-height: 1.5;
        }

        .empty-icon {
            font-size: 18px;
            margin-bottom: 4px;
        }
    </style>
</head>
<body>
    <h3>⚡ TouchGrass</h3>
    <div id="debugBox">Loading...</div>
    <label>Teacher</label>
    <select id="teacherFilter">
        <option value="all">All teachers</option>
    </select>

    <button id="applyFilters">Apply Filter</button>

    <div class="toggle-wrap">
      <span class="toggle-label-text">Dark mode</span>
      <label class="toggle-switch">
        <input type="checkbox" id="dark-toggle">
        <span class="toggle-slider"></span>
      </label>
    </div>

    <div id="pinned-section">
      <div id="pinned-header">📌 Pinned <span id="pin-count"></span></div>
      <div id="pinned-list"><div class="empty-state">Loading…</div></div>
    </div>

    <label>Milestone 1 check</label>
    <button id="testAuth">Test Classroom API Auth</button>
    <div id="authResult" style="font-size: 11px; color: #9f9; word-wrap: break-word;"></div>

    <label>Milestone 2 check</label>
    <select id="courseSelect"><option value="">Run auth test first ↑</option></select>
    <button id="syncCourse">Sync Selected Course Data</button>
    <div id="syncResult" style="font-size: 11px; color: #9cf; word-wrap: break-word;"></div>

    <label>Milestone 4 check: Difficulty Estimation</label>
    <select id="assignmentSelect"><option value="">Sync a course first ↑</option></select>
    <button id="estimateBtn">Estimate Difficulty</button>
    <div id="difficultyResult" style="font-size: 12px; color: #fc9; word-wrap: break-word;"></div>

    <script src="popup.js"></script>
</body>
</html>
