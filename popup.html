<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            width: 300px;
            font-family: sans-serif;
            padding: 12px;
            background: #111;
            color: #eee;
            margin: 0;
        }

        h3 {
            margin: 0 0 12px;
            font-size: 16px;
            border-bottom: 1px solid #333;
            padding-bottom: 8px;
        }

        #debugBox {
            background: #ffff00;
            color: #000;
            padding: 8px;
            font-size: 11px;
            margin-bottom: 12px;
            border-radius: 4px;
            word-wrap: break-word;
            max-height: 100px;
            overflow-y: auto;
            font-family: monospace;
        }

        label {
            font-size: 12px;
            color: #aaa;
            display: block;
            margin-top: 8px;
            margin-bottom: 4px;
        }

        select, button, input[type=text] {
            width: 100%;
            margin-bottom: 8px;
            padding: 8px;
            background: #222;
            color: #eee;
            border: 1px solid #444;
            border-radius: 4px;
            font-size: 13px;
            box-sizing: border-box;
        }

        button {
            cursor: pointer;
            background: #007bff;
            color: white;
            border: none;
            font-weight: bold;
            margin-top: 12px;
        }

            button:hover {
                background: #0056b3;
            }

        #manualTopicsBox {
            display: none;
        }

        .questionCard {
            background: #1c1c1c;
            border: 1px solid #333;
            border-radius: 6px;
            padding: 8px;
            margin-bottom: 8px;
            font-size: 12px;
        }

            .questionCard .qLabel {
                font-weight: bold;
                color: #fca;
            }

            .questionCard .qTopics {
                color: #9cf;
            }

            .questionCard .qConcepts {
                color: #9f9;
            }

            .questionCard .qDifficulty {
                color: #f96;
                font-weight: bold;
            }

            .questionCard .qReasoning {
                color: #aaa;
                font-style: italic;
            }

        /* ---- Posts on this page / Pinned posts (shared list styling) ---- */
        #stream-section, #pinned-section {
            margin-top: 14px;
            border-top: 1px solid #333;
            padding-top: 10px;
        }

        #stream-header, #pinned-header {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: #aaa;
            font-weight: 600;
            margin-bottom: 6px;
        }

        #stream-list, #pinned-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 180px;
            overflow-y: auto;
        }

        .pinned-item {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #1c1c1c;
            border: 1px solid #333;
            border-radius: 6px;
            padding: 8px;
            cursor: pointer;
            z-index:0;
        }

        .pinned-item:hover {
            background: #262626;
        }

        .pin-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #7F77DD;
            flex-shrink: 0;
        }

        .pin-snippet {
            font-size: 11px;
            color: #ddd;
            line-height: 1.4;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            line-clamp: 2;
           -webkit-box-orient: vertical;
           z-index:0;
        }

        .pin-time {
            font-size: 10px;
            color: #666;
            margin-top: 2px;
        }

        .unpin-btn, .pin-toggle-btn {
            background: none;
            border: none;
            color: #7f5e96;
            font-size: 14px;
            cursor: pointer;
            padding: 2px 6px;
            width: auto;
            margin: 50;
            flex-shrink: 0;
            z-index:0;

        }

        .unpin-btn:hover {
            color: #f87171;
            background: rgba(248, 113, 113, 0.15);
            border-radius: 4px;
        }

        .pin-toggle-btn:hover {
            background: rgba(127, 119, 221, 0.15);
            border-radius: 4px;
        }

        .empty-state {
            font-size: 11px;
            color: #666;
            text-align: center;
            padding: 14px 0;
            line-height: 1.5;
        }

        .empty-icon {
            font-size: 18px;
            margin-bottom: 4px;
        }
    </style>
</head>
<body>
    <h3>⚡ TouchGrass</h3>

    <button id="openPlanner" style="background:#28a745;">📅 Open Study Planner</button>

    <div id="debugBox">Loading...</div>
    <label>Teacher</label>
    <select id="teacherFilter">
        <option value="all">All teachers</option>
    </select>

    <button id="applyFilters">Apply Filter</button>

    <div id="stream-section">
      <div id="stream-header">📄 Posts on this page <span id="stream-count"></span></div>
      <div id="stream-list"><div class="empty-state">Loading…</div></div>
    </div>

    <div id="pinned-section">
      <div id="pinned-header">📌 Pinned <span id="pin-count"></span></div>
      <div id="pinned-list"><div class="empty-state">Loading…</div></div>
    </div>

    <button id="openFiles" style="background:#6f42c1;">📎 Open All Files</button>
    
    <label>Milestone 1 check</label>
    <button id="testAuth">Test Classroom API Auth</button>
    <div id="authResult" style="font-size: 11px; color: #9f9; word-wrap: break-word;"></div>

    <label>Milestone 2 check</label>
    <select id="courseSelect"><option value="">Run auth test first ↑</option></select>
    <button id="syncCourse">Sync Selected Course Data</button>
    <div id="syncResult" style="font-size: 11px; color: #9cf; word-wrap: break-word;"></div>

    <label>Milestone 4 check: Difficulty Estimation</label>
    <select id="assignmentSelect"><option value="">Sync a course first ↑</option></select>
    <button id="estimateBtn">Estimate Difficulty</button>
    <div id="difficultyResult" style="font-size: 12px; color: #fc9; word-wrap: break-word;"></div>

    <label>Milestone 5 check: Topic & Concept Breakdown (per question)</label>
    <button id="analyzeTopicsBtn">Analyze Question-by-Question</button>
    <button id="useManualTopicsBtn" style="background:#555;">Use My Own Topic List Instead</button>
    <div id="manualTopicsBox">
        <label>Enter topics, comma-separated:</label>
        <input type="text" id="manualTopicsInput" placeholder="e.g. Graphs, Trees, Recursion">
        <button id="saveManualTopicsBtn">Save Topics & Retry</button>
    </div>
    <div id="topicStatus" style="font-size: 12px; color: #fca; word-wrap: break-word;"></div>
    <div id="topicResult"></div>

    <script src="popup.js"></script>
</body>
</html>
