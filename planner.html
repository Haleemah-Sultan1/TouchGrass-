<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>TouchGrass Study Planner</title>
    <style>
        body {
            font-family: sans-serif;
            background: #111;
            color: #eee;
            max-width: 900px;
            margin: 0 auto;
            padding: 24px;
        }

        h1 {
            font-size: 22px;
        }

        label {
            display: block;
            margin-top: 14px;
            margin-bottom: 4px;
            font-size: 13px;
            color: #aaa;
        }

        input, select, textarea {
            width: 100%;
            padding: 8px;
            background: #222;
            color: #eee;
            border: 1px solid #444;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
            font-family: inherit;
        }

        .row {
            display: flex;
            gap: 16px;
        }

            .row > div {
                flex: 1;
            }

        button {
            margin-top: 20px;
            padding: 10px 20px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }

            button:hover {
                background: #0056b3;
            }

        #status {
            margin-top: 16px;
            color: #fc9;
            font-size: 13px;
        }

        #resultArea {
            margin-top: 24px;
        }

        .dayCard {
            background: #1c1c1c;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 12px;
        }

            .dayCard h3 {
                margin: 0 0 8px;
                color: #9cf;
            }

        .session {
            border-left: 3px solid #f96;
            padding: 6px 10px;
            margin-bottom: 6px;
            background: #222;
            border-radius: 4px;
            font-size: 13px;
        }

            .session .title {
                font-weight: bold;
            }

            .session .meta {
                color: #999;
                font-size: 11px;
            }

        .difficulty {
            color: #f96;
            font-weight: bold;
        }

        #overflowBox {
            background: #3a1a1a;
            border: 1px solid #a33;
            border-radius: 8px;
            padding: 12px;
            margin-top: 12px;
            color: #fbb;
        }

        .subjectRow {
            background: #1c1c1c;
            border: 1px solid #333;
            border-radius: 6px;
            padding: 10px;
            margin-bottom: 8px;
        }

            .subjectRow .subjectHeader {
                display: flex;
                align-items: center;
                gap: 8px;
                margin-bottom: 6px;
            }

                .subjectRow .subjectHeader input[type=checkbox] {
                    width: auto;
                    margin: 0;
                }

            .subjectRow .subjectDetails {
                display: none;
            }

            .subjectRow.checked .subjectDetails {
                display: block;
            }

            .subjectRow input[type=number] {
                width: 80px;
                display: inline-block;
            }

        .prefRow {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #1c1c1c;
            border: 1px solid #333;
            border-radius: 6px;
            padding: 8px 10px;
            margin-bottom: 6px;
        }

            .prefRow input[type=checkbox] {
                width: auto;
                margin: 0;
            }

            .prefRow input[type=number] {
                width: 60px;
                margin: 0;
            }

            .prefRow label {
                margin: 0;
                flex: 1;
            }

        #timetableFields, #studyPlanFields {
            display: none;
        }
    </style>
</head>
<body>

    <h1>📅 TouchGrass Planner</h1>

    <label>What do you need?</label>
    <select id="modeSelect">
        <option value="timetable">Timetable (Complete Assignment Deadlines)</option>
        <option value="study_plan">Study Plan (Prepare for Exams / Study a Subject)</option>
    </select>

    <div class="row">
        <div>
            <label>Start date</label>
            <input type="date" id="startDate">
        </div>
        <div>
            <label>End date</label>
            <input type="date" id="endDate">
        </div>
    </div>

    <label>Free hours available per day</label>
    <input type="number" id="hoursPerDay" min="0.5" max="16" step="0.5" value="3">

    <!-- ===== Timetable mode fields ===== -->
    <div id="timetableFields">
        <label>Which subject is your highest priority? (optional)</label>
        <select id="prioritySubject"><option value="">No preference</option></select>

        <label>Which type of work do you want to prioritize? (select up to 3, ranked)</label>
        <div id="workTypeChecklist">
            <div class="prefRow"><input type="checkbox" class="prefChk" data-type="Assignments"><label>Assignments</label><input type="number" class="prefRank" min="1" max="3" placeholder="rank"></div>
            <div class="prefRow"><input type="checkbox" class="prefChk" data-type="Quizzes"><label>Quizzes</label><input type="number" class="prefRank" min="1" max="3" placeholder="rank"></div>
            <div class="prefRow"><input type="checkbox" class="prefChk" data-type="Lab Tasks"><label>Lab Tasks</label><input type="number" class="prefRank" min="1" max="3" placeholder="rank"></div>
            <div class="prefRow"><input type="checkbox" class="prefChk" data-type="Projects"><label>Projects</label><input type="number" class="prefRank" min="1" max="3" placeholder="rank"></div>
        </div>
    </div>

    <!-- ===== Study Plan mode fields ===== -->
    <div id="studyPlanFields">
        <label>Select 1–5 subjects to study, set a priority rank (1 = highest), and list topics:</label>
        <div id="subjectChecklist"></div>
    </div>

    <button id="generateBtn">Generate Plan</button>
    <div id="status"></div>
    <div id="resultArea"></div>

    <script src="planner.js"></script>
</body>
</html>
