<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>TouchGrass — All Files</title>
  <style>
    body { font-family: sans-serif; background:#111; color:#eee; margin:0; padding:20px; }
    h2 { margin-top:0; }
    .toolbar { display:flex; align-items:center; gap:10px; margin-bottom:14px; flex-wrap:wrap; }
    .toolbar button { padding:8px 14px; background:#007bff; color:#fff; border:none; border-radius:4px; cursor:pointer; font-weight:bold; }
    .toolbar button:hover { background:#0056b3; }
    #search-box { flex:1; min-width:160px; padding:8px 12px; background:#1c1c1c; color:#eee; border:1px solid #444; border-radius:4px; font-size:13px; box-sizing:border-box; }
    #file-count { color:#888; font-size:13px; margin-left:auto; }
    #type-filters { display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
    .type-filter-btn { padding:6px 14px; background:#1c1c1c; border:1px solid #333; border-radius:16px; color:#aaa; font-size:12px; cursor:pointer; }
    .type-filter-btn:hover { border-color:#555; color:#ddd; }
    .type-filter-btn.active { background:#6f42c1; color:#fff; border-color:#6f42c1; }
    mark.search-hl { background:#ffd54f; color:#111; padding:0 2px; border-radius:2px; font-weight:600; }
    table { width:100%; border-collapse:collapse; }
    th, td { padding:10px; border-bottom:1px solid #333; text-align:left; font-size:13px; vertical-align:middle; }
    th { color:#aaa; font-size:12px; text-transform:uppercase; letter-spacing:0.04em; }
    .file-title { cursor:pointer; color:#8ab4f8; }
    .file-title:hover { text-decoration:underline; }
    .file-context { color:#999; max-width:320px; }
    .file-actions button { margin-right:6px; padding:5px 10px; background:#222; color:#eee; border:1px solid #444; border-radius:4px; cursor:pointer; font-size:12px; }
    .file-actions button:hover { background:#333; }
    .empty { text-align:center; color:#666; padding:30px 0; }
  </style>
</head>
<body>
  <h2>📎 All Files</h2>
  <div class="toolbar">
    <label><input type="checkbox" id="select-all"> Select all</label>
    <input type="text" id="search-box" placeholder="🔍 Search files...">
    <button id="open-selected">Open selected in new tabs</button>
    <button id="download-selected">Download selected</button>
    <span id="file-count"></span>
  </div>
  <div id="type-filters"></div>
  <table>
    <thead>
      <tr><th></th><th>Type</th><th>File</th><th>From announcement</th><th>Actions</th></tr>
    </thead>
    <tbody id="files-tbody"></tbody>
  </table>
  <script src="files.js"></script>
</body>
</html>
